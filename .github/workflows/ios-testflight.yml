name: Upload iOS TestFlight build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed SHA, exactly the selected release workflow commit
        required: true
        type: string
  # Register the workflow on its initial release branch. Push never uploads.
  push:
    branches: [release/ios-testflight-pr101]
    paths: [.github/workflows/ios-testflight.yml]

permissions:
  contents: read

concurrency:
  group: agentsdock-ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: direct-production
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AGENTSDOCK_APP_VARIANT: production
      CI: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the exact reviewed hosted workflow
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ZhengyiLuo/AgentsDock
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          [[ "$GITHUB_REF" = refs/heads/main || "$GITHUB_REF" = refs/heads/release/* ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ZhengyiLuo/AgentsDock
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - id: source
        name: Verify the source pin and release guards
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --test scripts/tests/ios_testflight_workflow.test.mjs mobile-react/tests/ios-testflight-metadata.test.mjs mobile-react/tests/ios-archive-symbols.test.mjs

      - name: Check Apple access and build-number availability
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node mobile-react/scripts/ios-testflight-metadata.mjs check

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies and validate mobile source
        working-directory: mobile-react
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:downloads
          node --test tests/media-save-config.test.mjs tests/server-qr-scanner.test.mjs tests/expo-ui-touch-lifecycle.test.mjs tests/backend-mark.test.mjs
          node scripts/run-history-tests.mjs src/store/useAppStore.sync-stress.test.ts --native-mocks

      - name: Generate production iOS project and verify native parity
        working-directory: mobile-react
        env:
          RCT_SYMBOLICATE_PREBUILT_FRAMEWORKS: '1'
        run: |
          set -euo pipefail
          xcodebuild -version
          pnpm exec expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          pnpm verify:ios-native
          node --test tests/ios-release-metadata.test.mjs

      - id: key
        name: Materialize Apple API key only for signing and upload
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set +x
          node --input-type=module <<'JS'
          import { mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'agentsdock-ios-signing-'));
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=${directory}\n`);
          writeFileSync(join(directory, 'AuthKey.p8'), Buffer.from(process.env.APPLE_API_KEY_P8_BASE64, 'base64'), { mode: 0o600 });
          JS

      - name: Archive the production iPhone and iPad app
        working-directory: mobile-react
        env:
          KEY_DIRECTORY: ${{ steps.key.outputs.directory }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          set +x
          xcodebuild -quiet -workspace ios/AgentsDock.xcworkspace -scheme AgentsDock \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgentsDock.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM=KRR35MWWHD CODE_SIGN_STYLE=Automatic archive

      - name: Validate archive metadata, bundled resources and native ABI
        working-directory: mobile-react
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AgentsDock.xcarchive/Products/Applications/AgentsDock.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.zhengyiluo.ZenithDock
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$(node -p 'require("./app.json").expo.version')"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$(node -p 'require("./app.json").expo.ios.buildNumber')"
          test -s "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$APP/Info.plist"
          codesign --verify --deep --strict "$APP"
          pnpm verify:ios-archive-abi "$RUNNER_TEMP/AgentsDock.xcarchive"
          node scripts/collect-ios-archive-symbols.mjs "$RUNNER_TEMP/AgentsDock.xcarchive" ios/Pods

      - name: Recheck build number immediately before upload
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node mobile-react/scripts/ios-testflight-metadata.mjs check

      - name: Cloud sign and upload to TestFlight only
        env:
          KEY_DIRECTORY: ${{ steps.key.outputs.directory }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          set +x
          xcodebuild -quiet -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentsDock.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist scripts/config/ios-app-store-upload.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Verify Apple processing and TestFlight status
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node mobile-react/scripts/ios-testflight-metadata.mjs wait

      - name: Always erase disposable Apple API key
        if: ${{ always() && steps.key.outputs.directory != '' }}
        env:
          KEY_DIRECTORY: ${{ steps.key.outputs.directory }}
        run: |
          set +x
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { lstatSync, realpathSync, rmSync } from 'node:fs';
          import { basename, dirname } from 'node:path';
          const directory = process.env.KEY_DIRECTORY;
          assert.ok(!lstatSync(directory).isSymbolicLink());
          assert.equal(dirname(realpathSync(directory)), realpathSync(process.env.RUNNER_TEMP));
          assert.ok(basename(directory).startsWith('agentsdock-ios-signing-'));
          rmSync(directory, { recursive: true });
          JS

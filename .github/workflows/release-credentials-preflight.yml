name: Check release credentials (non-publishing)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed SHA, exactly the selected main or release/* workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentsdock-release-credentials-preflight
  cancel-in-progress: false

jobs:
  credentials:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ZhengyiLuo/AgentsDock' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: direct-production
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the exact reviewed hosted workflow
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ZhengyiLuo/AgentsDock
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          [[ "$GITHUB_REF" = refs/heads/main || "$GITHUB_REF" = refs/heads/release/* ]]
          git check-ref-format "$GITHUB_REF"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ZhengyiLuo/AgentsDock
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - id: source
        name: Verify the checked-out source pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"

      - id: private
        name: Allocate disposable credential scratch directory
        run: |
          set -euo pipefail
          umask 077
          PREFLIGHT_DIR="$(mktemp -d "$RUNNER_TEMP/agentsdock-credentials.XXXXXXXX")"
          printf 'directory=%s\n' "$PREFLIGHT_DIR" >> "$GITHUB_OUTPUT"

      - id: token
        name: Check release-token identity and repository metadata without writes
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.private.outcome == 'success' }}
        env:
          RELEASE_TOKEN: ${{ secrets.AGENTSDOCK_RELEASE_TOKEN }}
        run: |
          set +x
          python3 - <<'PY'
          import http.client, json, os, sys

          def get_metadata(path, token):
              connection = http.client.HTTPSConnection("api.github.com", timeout=30)
              try:
                  # Fixed HTTPS host and GET only; never follow credential-bearing redirects.
                  connection.request("GET", path, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "AgentsDock-release-credential-preflight",
                  })
                  response = connection.getresponse()
                  payload = response.read(2 * 1024 * 1024 + 1)
                  if response.status != 200 or len(payload) > 2 * 1024 * 1024:
                      raise ValueError("metadata unavailable")
                  return json.loads(payload)
              finally:
                  connection.close()

          try:
              token = os.environ.get("RELEASE_TOKEN", "")
              if not token:
                  raise ValueError("missing token")
              identity = get_metadata("/user", token)
              if not isinstance(identity.get("id"), int) or not identity.get("login"):
                  raise ValueError("missing authenticated identity")
              for repository in ("ZhengyiLuo/AgentsDock", "ZhengyiLuo/AgentsDock-Releases"):
                  metadata = get_metadata("/repos/" + repository, token)
                  if metadata.get("full_name") != repository or metadata.get("permissions", {}).get("push") is not True:
                      raise ValueError("repository metadata unavailable")
              print("AGENTSDOCK_RELEASE_TOKEN: authenticated identity and both repository push metadata checks passed.")
              print("Read-only metadata is not proof of token Contents/Workflows write permission or publication ability.")
          except Exception:
              print("::error::AGENTSDOCK_RELEASE_TOKEN identity/repository metadata check failed; verify the existing credential and selected repositories.")
              sys.exit(1)
          PY

      - id: signing
        name: Verify existing Developer ID with a disposable signing probe
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.private.outcome == 'success' }}
        env:
          PREFLIGHT_DIR: ${{ steps.private.outputs.directory }}
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, re, secrets, shlex, subprocess, sys

          def checkpoint(name):
              # Call sites use fixed public labels only, never credential data,
              # identity names, paths, command arguments or captured output.
              print("Developer ID probe checkpoint: " + name, flush=True)

          def command(arguments, timeout=60):
              result = subprocess.run(arguments, capture_output=True, timeout=timeout, check=False)
              if result.returncode:
                  raise ValueError("signing command failed")
              return result.stdout.decode("utf-8")

          def keychain_state():
              return {
                  "search": shlex.split(command(["security", "list-keychains", "-d", "user"])),
                  "default": shlex.split(command(["security", "default-keychain", "-d", "user"])),
              }

          try:
              checkpoint("validate-private-directory")
              private = pathlib.Path(os.environ["PREFLIGHT_DIR"]).resolve(strict=True)
              if private.parent != pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) or not private.name.startswith("agentsdock-credentials."):
                  raise ValueError("invalid private directory")
              checkpoint("decode-existing-certificate")
              encoded, password = os.environ.get("CERTIFICATE_P12_BASE64", ""), os.environ.get("CERTIFICATE_PASSWORD", "")
              if not encoded or not password:
                  raise ValueError("missing signing secret")
              certificate = private / "certificate.p12"
              certificate.write_bytes(base64.b64decode("".join(encoded.split()), validate=True))
              keychain = str(private / "signing.keychain-db")
              checkpoint("snapshot-keychain-state")
              baseline = keychain_state()
              if not baseline["search"] or len(baseline["default"]) != 1:
                  raise ValueError("unexpected hosted keychain state")
              (private / "keychain-baseline.json").write_text(json.dumps(baseline))
              keychain_password = secrets.token_hex(32)
              checkpoint("create-disposable-keychain")
              try:
                  command(["security", "create-keychain", "-p", keychain_password, keychain])
              finally:
                  # Creation may temporarily add its keychain to the search list.
                  # Restore the exact snapshot immediately; never select a new default.
                  checkpoint("restore-keychain-search-list")
                  command(["security", "list-keychains", "-d", "user", "-s", *baseline["search"]])
              checkpoint("verify-keychain-state")
              if keychain_state() != baseline:
                  raise ValueError("keychain state was not restored")
              checkpoint("configure-disposable-keychain")
              command(["security", "set-keychain-settings", "-lut", "600", keychain])
              command(["security", "unlock-keychain", "-p", keychain_password, keychain])
              checkpoint("import-existing-certificate")
              command(["security", "import", str(certificate), "-P", password, "-x", "-t", "agg", "-f", "pkcs12", "-k", keychain, "-T", "/usr/bin/codesign"])
              checkpoint("configure-signing-key-access")
              command(["security", "set-key-partition-list", "-S", "apple-tool:,apple:,codesign:", "-s", "-k", keychain_password, keychain])
              checkpoint("find-valid-developer-id")
              identities = command(["security", "find-identity", "-v", "-p", "codesigning", keychain])
              matches = re.findall(r'^\s*\d+\)\s+([0-9A-Fa-f]{40})\s+"Developer ID Application: [^"\r\n]+"\s*$', identities, re.MULTILINE)
              if len(matches) != 1:
                  raise ValueError("expected one existing Developer ID Application identity")
              probe_source, probe = private / "probe.c", private / "probe"
              probe_source.write_text("int main(void) { return 0; }\n")
              checkpoint("compile-disposable-probe")
              command(["xcrun", "clang", str(probe_source), "-o", str(probe)])
              try:
                  checkpoint("enable-disposable-keychain-for-signing")
                  # --keychain selects the identity, but codesign still resolves
                  # its certificate chain through the user's search list.
                  command(["security", "list-keychains", "-d", "user", "-s", keychain, *baseline["search"]])
                  if keychain_state() != {"search": [keychain, *baseline["search"]], "default": baseline["default"]}:
                      raise ValueError("unexpected signing search list")
                  checkpoint("sign-disposable-probe")
                  command(["codesign", "--force", "--sign", matches[0], "--keychain", keychain, "--timestamp=none", "--options", "runtime", str(probe)])
                  checkpoint("verify-disposable-signature")
                  command(["codesign", "--verify", "--strict", "-R=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists", str(probe)])
              finally:
                  checkpoint("restore-signing-search-list")
                  command(["security", "list-keychains", "-d", "user", "-s", *baseline["search"]])
              checkpoint("verify-final-keychain-state")
              if keychain_state() != baseline:
                  raise ValueError("keychain state changed")
              print("MACOS_CERTIFICATE_P12_BASE64 and MACOS_CERTIFICATE_PASSWORD: existing Developer ID import and disposable signing/verification passed.")
              print("The probe uses no timestamp or notarization submission and is not full Electron signing/notarization acceptance.")
          except Exception:
              print("::error::Developer ID credential probe failed; inspect the existing P12/password and identity validity. Private command output is intentionally suppressed.")
              sys.exit(1)
          PY

      - id: notary
        name: Check existing Apple API authentication using read-only history
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.private.outcome == 'success' }}
        env:
          PREFLIGHT_DIR: ${{ steps.private.outputs.directory }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys

          try:
              private = pathlib.Path(os.environ["PREFLIGHT_DIR"]).resolve(strict=True)
              if private.parent != pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) or not private.name.startswith("agentsdock-credentials."):
                  raise ValueError("invalid private directory")
              encoded, key_id, issuer = (os.environ.get(name, "") for name in ("APPLE_API_KEY_P8_BASE64", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"))
              if not encoded or not key_id or not issuer:
                  raise ValueError("missing Apple API secret")
              key = private / "notary-key.p8"
              key.write_bytes(base64.b64decode("".join(encoded.split()), validate=True))
              try:
                  result = subprocess.run(["xcrun", "notarytool", "history", "--key", str(key), "--key-id", key_id, "--issuer", issuer, "--output-format", "json", "--no-progress"], capture_output=True, timeout=120, check=False)
                  if result.returncode or len(result.stdout) > 8 * 1024 * 1024:
                      raise ValueError("history authentication failed")
                  payload = json.loads(result.stdout)
                  if not isinstance(payload.get("history"), list):
                      raise ValueError("unexpected history response")
                  print("APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER: read-only authentication passed; returned history count=" + str(len(payload["history"])) + ".")
                  # No submission names, IDs, timestamps, raw history, or error bodies are persisted or printed.
              finally:
                  key.unlink(missing_ok=True)
          except Exception:
              print("::error::Read-only Apple notarization authentication failed; verify the existing three Apple API secrets. No submission was made.")
              sys.exit(1)
          PY

      - id: cleanup
        name: Always restore keychain state and erase disposable credentials
        if: ${{ always() && steps.private.outcome == 'success' }}
        env:
          PREFLIGHT_DIR: ${{ steps.private.outputs.directory }}
        run: |
          set +x
          python3 - <<'PY'
          import json, os, pathlib, shlex, shutil, subprocess, sys

          def command(arguments):
              result = subprocess.run(arguments, capture_output=True, timeout=30, check=False)
              if result.returncode:
                  raise ValueError("cleanup command failed")
              return result.stdout.decode("utf-8")

          failed = False
          try:
              raw = pathlib.Path(os.environ["PREFLIGHT_DIR"])
              private = raw.resolve(strict=True)
              if raw.is_symlink() or private.parent != pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True) or not private.name.startswith("agentsdock-credentials."):
                  raise ValueError("invalid cleanup target")
              baseline_file, keychain = private / "keychain-baseline.json", private / "signing.keychain-db"
              try:
                  if keychain.exists():
                      command(["security", "delete-keychain", str(keychain)])
              except Exception:
                  failed = True
              finally:
                  if baseline_file.exists():
                      try:
                          baseline = json.loads(baseline_file.read_text())
                          command(["security", "list-keychains", "-d", "user", "-s", *baseline["search"]])
                          actual = {
                              "search": shlex.split(command(["security", "list-keychains", "-d", "user"])),
                              "default": shlex.split(command(["security", "default-keychain", "-d", "user"])),
                          }
                          if actual != baseline:
                              raise ValueError("keychain restoration mismatch")
                      except Exception:
                          failed = True
                  shutil.rmtree(private)
          except Exception:
              failed = True
          if failed:
              print("::error::Disposable credential cleanup or exact keychain-state restoration failed.")
              sys.exit(1)
          print("Disposable credentials/probe erased; original keychain search list and default verified where captured.")
          PY

      - name: Report credential-only results and acceptance boundaries
        if: ${{ always() }}
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          TOKEN_RESULT: ${{ steps.token.outcome }}
          SIGNING_RESULT: ${{ steps.signing.outcome }}
          NOTARY_RESULT: ${{ steps.notary.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
        run: |
          python3 - <<'PY'
          import os
          labels = {
              "SOURCE_RESULT": "Reviewed source pin",
              "TOKEN_RESULT": "AGENTSDOCK_RELEASE_TOKEN (identity/repository metadata only)",
              "SIGNING_RESULT": "MACOS_CERTIFICATE_P12_BASE64 + MACOS_CERTIFICATE_PASSWORD (disposable probe)",
              "NOTARY_RESULT": "APPLE_API_KEY_P8_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER (read-only auth)",
              "CLEANUP_RESULT": "Credential cleanup / keychain restoration",
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Non-publishing release credential preflight\n\n")
              for name, label in labels.items():
                  value = os.environ.get(name, "")
                  value = value if value in {"success", "failure", "cancelled", "skipped"} else "not run"
                  summary.write("- " + label + ": " + value + "\n")
              summary.write("\nRepository push metadata is not proof of token Contents/Workflows write permission. The disposable signing probe and read-only Apple authentication are not complete Electron build/notarization acceptance. Keychain creation may temporarily change the hosted search list; it is immediately restored. The probe keychain is added only during signing/verification for certificate-chain resolution, then the exact original list is restored in a finally block and checked again during cleanup. No package, release, draft, artifact, app, or notarization submission was published or uploaded.\n")
          PY

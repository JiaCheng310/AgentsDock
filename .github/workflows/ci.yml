name: Verify source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-coordinated-update-replay:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ZhengyiLuo/AgentsDock' && github.ref == 'refs/heads/test/recoverable-update-replay-20261017'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable native prerequisites
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          /bin/launchctl print "gui/$(id -u)" > /dev/null
          uv python install 3.13
          command -v tmux || brew install tmux
      - name: Download exact unpublished A and B packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates/a" "$RUNNER_TEMP/candidates/b"
          for entry in a:1.0.11-beta.2:39086491615 b:1.0.11-beta.3:39086563673; do
            IFS=: read -r letter version signing_run <<< "$entry"
            destination="$RUNNER_TEMP/candidates/$letter"
            gh release download "v$version" --repo ZhengyiLuo/AgentsDock --dir "$destination" \
              --pattern "AgentsDock-$version-mac-universal.zip" \
              --pattern "AgentsDock-$version-mac-universal.zip.blockmap" \
              --pattern beta-mac.yml --pattern SHA256SUMS \
              --pattern agents-server-npm-manifest.json --pattern agents-server-npm-manifest.sig
            gh run download "$signing_run" --repo ZhengyiLuo/AgentsServer \
              --dir "$RUNNER_TEMP/signer-$letter"
            signed=("$RUNNER_TEMP/signer-$letter"/signed-npm-server-*)
            test "${#signed[@]}" -eq 1
            cmp "$destination/agents-server-npm-manifest.json" "${signed[0]}/agents-server-npm-manifest.json"
            cmp "$destination/agents-server-npm-manifest.sig" "${signed[0]}/agents-server-npm-manifest.sig"
            cp "${signed[0]}/server-$version.tgz" "$destination/"
          done
      - name: Create private exact-origin routing on this disposable runner
        run: |
          set -euo pipefail
          network="$RUNNER_TEMP/coordinated-network"
          mkdir -m 700 "$network"
          cat > "$network/ca.cnf" <<'EOF'
          [req]
          distinguished_name=dn
          x509_extensions=ca
          prompt=no
          [dn]
          CN=AgentsDock disposable update replay
          [ca]
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid:always
          EOF
          cat > "$network/leaf.cnf" <<'EOF'
          [req]
          distinguished_name=dn
          prompt=no
          [dn]
          CN=github.com
          EOF
          cat > "$network/leaf.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          subjectAltName=DNS:github.com,DNS:api.github.com,DNS:registry.npmjs.org
          EOF
          umask 077
          openssl req -config "$network/ca.cnf" -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$network/ca.key" -out "$network/ca.pem"
          openssl req -config "$network/leaf.cnf" -new -newkey rsa:2048 -nodes -sha256 \
            -keyout "$network/leaf.key" -out "$network/leaf.csr"
          openssl x509 -req -sha256 -days 1 -in "$network/leaf.csr" -CA "$network/ca.pem" \
            -CAkey "$network/ca.key" -CAcreateserial -extfile "$network/leaf.ext" -out "$network/leaf.pem"
          for host in github.com api.github.com registry.npmjs.org; do
            openssl verify -CAfile "$network/ca.pem" -purpose sslserver -verify_hostname "$host" "$network/leaf.pem"
          done
          if rg -i '(^|[[:space:]])(github\.com|api\.github\.com|registry\.npmjs\.org)([[:space:]]|$)' /etc/hosts; then
            echo 'Replay host already has a hosts override.' >&2
            exit 1
          fi
          cp /etc/hosts "$network/hosts.baseline"
          cp "$network/hosts.baseline" "$network/hosts.active"
          printf '\n# AGENTSDOCK-DISPOSABLE-COORDINATED-REPLAY\n127.0.0.1 github.com api.github.com registry.npmjs.org\n' >> "$network/hosts.active"
          python3 -c 'import ssl,sys; c=ssl.create_default_context(); sys.stdout.write("".join(ssl.DER_cert_to_PEM_cert(item) for item in c.get_ca_certs(binary_form=True)))' > "$network/trust-bundle.pem"
          cat "$network/ca.pem" >> "$network/trust-bundle.pem"
          sudo -n /usr/bin/security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$network/ca.pem"
          sudo -n cp "$network/hosts.active" /etc/hosts
          sudo -n /usr/bin/dscacheutil -flushcache
          sudo -n /usr/bin/killall -HUP mDNSResponder
          echo "NODE_EXTRA_CA_CERTS=$network/ca.pem" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$network/trust-bundle.pem" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=$network/trust-bundle.pem" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=$network/trust-bundle.pem" >> "$GITHUB_ENV"
          echo 'NO_PROXY=github.com,api.github.com,registry.npmjs.org,localhost,127.0.0.1,::1' >> "$GITHUB_ENV"
          /bin/launchctl setenv SSL_CERT_FILE "$network/trust-bundle.pem"
          /bin/launchctl setenv NODE_EXTRA_CA_CERTS "$network/ca.pem"
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" RUNNER_TEMP="$RUNNER_TEMP" \
            "$(command -v node)" scripts/coordinated-update-test-feed.mjs "$RUNNER_TEMP/candidates" \
            "$network/leaf.pem" "$network/leaf.key" "$network/feed.pid" \
            > "$network/feed.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 --cacert "$network/ca.pem" \
              --resolve github.com:443:127.0.0.1 \
              https://github.com/ZhengyiLuo/AgentsDock/releases.atom \
              -o "$network/probe.atom"; then
              rg -q 'v1\.0\.11-beta\.3' "$network/probe.atom"
              exit 0
            fi
            sleep 1
          done
          echo 'Private exact-origin feed did not become ready.' >&2
          exit 1
      - name: Click real Update AgentsDock and verify Server first, App second
        run: node scripts/coordinated-update-test-journey.mjs "$RUNNER_TEMP/candidates"
      - name: Remove only this runner's owned routing and trust
        if: always()
        run: |
          set -euo pipefail
          network="$RUNNER_TEMP/coordinated-network"
          /bin/launchctl unsetenv SSL_CERT_FILE || true
          /bin/launchctl unsetenv NODE_EXTRA_CA_CERTS || true
          if [[ -f "$network/feed.pid" ]]; then
            feed_pid="$(cat "$network/feed.pid")"
            if [[ "$feed_pid" =~ ^[1-9][0-9]*$ ]]; then sudo -n kill -TERM "$feed_pid" || true; fi
          fi
          if [[ -f "$network/hosts.active" ]] && cmp -s /etc/hosts "$network/hosts.active"; then
            sudo -n cp "$network/hosts.baseline" /etc/hosts
            sudo -n /usr/bin/dscacheutil -flushcache
            sudo -n /usr/bin/killall -HUP mDNSResponder
          elif [[ -f "$network/hosts.active" ]]; then
            echo 'Hosts changed outside this disposable replay; refusing to erase that change.' >&2
            exit 1
          fi
          if [[ -f "$network/ca.pem" ]]; then
            fingerprint="$(openssl x509 -in "$network/ca.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
            sudo -n /usr/bin/security delete-certificate -Z "$fingerprint" /Library/Keychains/System.keychain || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: disposable-coordinated-update-evidence
          path: ${{ runner.temp }}/coordinated-update-native/public-evidence.json
          if-no-files-found: warn
          retention-days: 7

  server-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public CLI and existing signed-update entry point
        run: node --test server/npm/cli.test.cjs server/npm/agentsdock/*.test.cjs
      - name: Verify matched npm staging and publication guards
        run: node --test scripts/tests/verify*publication.test.mjs scripts/tests/agentsdock_cli_candidate_release.test.mjs scripts/tests/server_npm_publish_workflow.test.mjs scripts/tests/release_credentials_preflight.test.mjs
      - name: Verify desktop build reservations and non-publishing replay guards
        run: node --test scripts/tests/validate_desktop_build_number.test.mjs scripts/tests/direct-release-verification.test.mjs scripts/tests/direct-release-mirror.test.mjs scripts/tests/coordinated-release.test.mjs scripts/tests/published-server-paths.test.mjs
      - name: Verify disposable native CLI acceptance guards without creating services
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/tests -p test_agentsdock_cli_native_acceptance.py
      - name: Pack and install exact CLI/runtime in disposable npm prefixes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s server/tests -t server -p test_agentsdock_cli_package.py
          python3 -m unittest discover -s server/tests -t server -p test_npm_release_package.py

  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron
      - run: pnpm typecheck
        working-directory: electron
      - run: pnpm test
        working-directory: electron
      - run: pnpm build
        working-directory: electron

  mobile-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile-react/pnpm-lock.yaml
      # Keep source validation independent of native generation and signing.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: mobile-react
      - run: pnpm typecheck
        working-directory: mobile-react
      - run: pnpm test:history
        working-directory: mobile-react
      - run: pnpm test:server-setup
        working-directory: mobile-react
      - name: Verify manual server connection and profile management
        run: |
          node --test tests/server-manual-connection.test.mjs tests/server-profiles.test.mjs
        working-directory: mobile-react
      - name: Verify mobile latest-first sync and stable text rendering
        run: |
          node scripts/run-history-tests.mjs src/lib/server-profiles.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/storage/cache.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.integration.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.latest-first.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.sync-stress.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.lifecycle-hardening.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.timeline-recovery.test.ts --native-mocks
          node --test tests/markdown-reconciliation.test.mjs tests/markdown-content-compact.test.mjs tests/timeline-text-selection.test.mjs tests/team-network-ui-contract.test.mjs tests/button-wiring.test.mjs tests/interaction-reliability.test.mjs
        working-directory: mobile-react
      - run: node scripts/run-history-tests.mjs src/lib/team-references.test.ts
        working-directory: mobile-react
      - name: Verify cross-chat protocol, projection, and store races
        run: |
          node scripts/run-history-tests.mjs src/lib/cross-chat-protocol.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/lib/timeline-async-messages.test.ts --native-mocks
          node scripts/run-history-tests.mjs src/store/useAppStore.cross-chat-routes.test.ts --native-mocks
        working-directory: mobile-react
      - name: Verify cross-chat rendering and control interactions
        run: >-
          node --test
          tests/async-cross-chat-message-rendering.test.mjs
          tests/team-mention-composer.test.mjs
          tests/cross-chat-card-interactions.test.mjs
          tests/imported-cross-chat-rendering.test.mjs
          tests/cross-chat-composer-ui-contract.test.mjs
          tests/cross-chat-store-contract.test.mjs
          tests/cross-chat-timeline-ui-contract.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-release-metadata.test.mjs
        working-directory: mobile-react
      - run: node --test tests/ios-workspace-resolution.test.mjs
        working-directory: mobile-react

# This workflow verifies source only. It has no signing credentials, deployment
# authority, release publishing steps, or artifact uploads.

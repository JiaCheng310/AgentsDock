name: Verify source
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-server-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-upgrade:
    if: github.repository == 'ZhengyiLuo/AgentsDock' && github.ref == 'refs/heads/test/public-server-upgrade-20261020'
    strategy:
      fail-fast: false
      matrix:
        baseline: [legacy103, npm109]
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Prepare disposable native prerequisites
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          /bin/launchctl print "gui/$(id -u)" > /dev/null
          uv python install 3.13
          command -v tmux || brew install tmux
      - name: Exercise signed public App and managed Server
        run: node scripts/public-server-upgrade-acceptance.mjs "${{ matrix.baseline }}"
# Temporary test branch: no publication, signing, deployment, or artifact uploads.
